name: wordpack
description: "WordPack: offline vocabulary pack learner."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Versions are the newest that resolve together on Flutter 3.41 / Dart 3.11
# (riverpod_generator and drift_dev must share one analyzer version).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  csv: ^8.0.0
  desktop_drop: ^0.8.4
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  enough_convert: ^1.6.0
  file_picker: ^13.1.0
  file_selector: ^1.1.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.5.0
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.2
  share_plus: ^13.3.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  sqlite3: ^2.9.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  # Bundled, never downloaded at runtime (DECISIONS D-20). Both are variable
  # fonts: weights are applied through FontVariation in lib/ui/theme/app_theme.dart.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
        - asset: assets/fonts/Literata-Italic-Variable.ttf
          style: italic
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf

# App icon from the design canvas (tool/render_icon_test.dart renders the
# PNGs). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#2F4A8A"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 26
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
